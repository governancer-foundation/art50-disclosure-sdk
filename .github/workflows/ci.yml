#
# CI — Build / Lint / Test for @governancer-foundation/art50-disclosure-sdk.
# Single npm/TypeScript package: a library, imported by callers.
# Build system is npm + tsc (NOT pnpm/turbo). Tests run on vitest.
# Also runs the hand-authored anti-leak guard (scripts/oss-ip-guard.sh) so no
# secret or internal path can ride a build to a
# public push.

name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build / Lint / Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck (source + specs)
        # Keep `--noEmit` so this step never writes to dist/.
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke — the built package works when imported
        # The unit suite runs against the sources. This loads what would
        # actually ship and exercises the public entry points, so a broken
        # build output or a missing export cannot pass unnoticed.
        run: |
          node --input-type=module -e '
            import { resolveObligations, planDisclosures, buildManifest } from "./dist/index.js";
            const profile = { systemName: "ci-smoke", interactsWithPersons: true };
            const report = resolveObligations(profile);
            if (!report.applicable.includes("50(1)")) throw new Error("50(1) not resolved");
            const plan = planDisclosures(profile, { locale: "de" });
            if (plan.notices.length === 0) throw new Error("no notice rendered");
            const manifest = buildManifest(profile, {
              generatedAt: "2026-01-01T00:00:00.000Z", sdkVersion: "ci",
            });
            if (manifest.obligations.length !== 4) throw new Error("manifest incomplete");
            console.log("smoke ok:", report.applicable.join(","), "|", plan.notices[0].text);
          '

      - name: Example — the worked end-to-end walkthrough still runs
        # The example is documentation that executes. Running it here means it
        # cannot drift into describing an interface the package no longer has.
        run: node examples/end-to-end.mjs

      - name: Anti-leak guard (oss-ip-guard --dir .)
        # Sweep the publishable tree for secret/internal/trailer
        # leaks before anything is publishable. The guard is hand-authored
        # at scripts/oss-ip-guard.sh — CI only calls it.
        run: bash scripts/oss-ip-guard.sh --dir .

      - name: Pre-publish check (if present)
        # Optional: only runs when the repo carries a pre-publish-check.sh.
        # Keeps CI green before that script lands while wiring it once it does.
        run: |
          if [ -f scripts/pre-publish-check.sh ]; then
            bash scripts/pre-publish-check.sh
          else
            echo "scripts/pre-publish-check.sh not present — skipping."
          fi
